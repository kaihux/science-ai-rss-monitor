name: Mirror Quanta AI reporting

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quanta-ai-rss-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and filter Quanta RSS
        run: python scripts/fetch_quanta.py
      - name: Commit filtered feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quanta-feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update Quanta AI reporting feed"
            git push
          else
            echo "No changes"
          fi
